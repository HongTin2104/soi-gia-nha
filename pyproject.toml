[project]
name = "soi-gia-nha"
version = "0.2.0"
description = "Is this listing overpriced? Price check for Vietnamese real estate listings, with explanations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HongTin2104" }]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "huggingface_hub>=0.24",
  "numpy>=1.26",
  "lightgbm>=4.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "streamlit>=1.40"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["soi_gia_nha", "app", "scripts"]
branch = true

[tool.coverage.report]
# CI downloads the model and app data first. Without them the app tests are skipped and
# coverage drops to about 90%, so run `pytest` without --cov or fetch them (see CONTRIBUTING.md).
fail_under = 95
show_missing = true
exclude_also = ['if __name__ == "__main__":']
